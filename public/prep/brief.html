<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your interview prep</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="/prep/prep.css">
<!-- TEMPORARY walkthrough layer, SHOWCASE BRANCH ONLY — on this demo the reader of the
     candidate portal is the recruiter learning the product; on main a candidate page must
     never carry it. Delete with public/guide.css, public/guide.js and test/guide.test.js.
     See guide.css's header. -->
<link rel="stylesheet" href="/guide.css">
</head>
<body>

<!-- A candidate-facing page: the topbar carries the portal's own name and no recruiter
     navigation. The recruiter screens are a different audience and a different door. -->
<header class="topbar">
  <div class="topbar-inner">
    <span class="topbar-brand">Interview prep</span>
  </div>
</header>

<main class="brief">

  <div class="page-head">
    <!-- Honest placeholder copy. The real role title arrives in the payload and brief.js
         writes it in as text, so a page that never loads says something true rather than
         showing a gap where a role should be. -->
    <h1 id="role-title">Your interview prep</h1>
    <p class="page-sub">Built from what this agency knows about the client, not from the job
      advert. Nothing you do here is shown to your recruiter.</p>
    <p class="brief-cta"><a class="btn btn-primary btn-block" href="/prep/session">Practise for it</a></p>
    <!-- Hidden until the interview has happened (#77): brief.js unhides it on the payload's
         debrief_available. Plain words, and never the word "debrief" — no first-time candidate
         uses that about themselves. Not the primary button either: practising is still the thing
         to do here, and a second filled button beside it would make the page ask twice. -->
    <p class="brief-cta" id="debrief-cta" hidden><a class="btn btn-block" href="/prep/debrief">How did the interview go?</a></p>
    <!-- NOT hidden, and there is no flag to unhide it (#78) — do not "fix" this by analogy with
         the line above. The debrief CTA waits for `debrief_available` because a debrief before the
         interview is meaningless. A storybank is most useful BEFORE it: writing down the stories
         you already own is the preparation. So this link is unconditional, which is why brief.js
         needed no change at all for this ticket. -->
    <p class="brief-cta" id="stories-cta"><a class="btn btn-block" href="/prep/stories">Your stories</a></p>
    <p class="save-state" id="brief-state" role="status"></p>
  </div>

  <!-- The blocks the payload asks for, in the order it asks for them. Empty until the fetch
       returns; public/prep/registry.js owns every element inside it. -->
  <div id="blocks"></div>

</main>

<footer class="prep-footer">
  <p><a href="/prep/privacy">What we hold about you, and when it is deleted</a></p>
</footer>

<!-- A module script, so it is deferred by the platform. No ready-state wrapper is needed and
     one would be misleading about when this runs. -->
<script type="module" src="/prep/brief.js"></script>
<script src="/guide.js"></script>

</body>
</html>
