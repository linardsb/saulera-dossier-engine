<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Your prep · Interview prep</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/fonts.css">
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/app.css">
<style>
  /* Three stylesheets, not four, and that is deliberate: this page's whole vocabulary (.topbar,
     .page-head, .page-sub) is app.css's, it uses nothing from prep.css, and a fourth blocking
     stylesheet on the shortest-lived page in the product buys consistency on paper and pays for
     it in the one thing this page is judged on, which is painting at all before it leaves. */
  .prep { max-width: 60ch; }
  .prep p { font-size: var(--text-note); }

  /* A junction, not a destination. This heading is on screen for one round trip and is never
     read to the end, so it steps down the ramp and takes the muted ink: the page should read as
     a breath between two places rather than announce itself as a third one. */
  .prep .page-head h1 {
    font-size: var(--text-h3);
    color: var(--text-muted);
  }

  /* The head is the only thing here, so the space app.css reserves under it for a page's
     content is space this page never fills. */
  .prep .page-head { margin-bottom: var(--space-6); }
</style>
</head>
<body>

<!-- THE LANDING PAD, and deliberately nothing else. /prep/auth/enter redirects here after
     spending the magic link, and that redirect must not change (it is the one path a
     candidate's email actually contains) — so this page stays where it is and simply decides
     where the candidate goes next.

     Signed in  -> /prep/brief, the dashboard #21 built and #22 gave real data to.
     Signed out -> /prep/login, which can explain itself and offer the code path.

     The signed-out bounce below is the thing that must survive any rewrite of this page.
     Every page under /prep holding candidate content asks the SERVER whether there is a
     session, because the cookie is HttpOnly and no script here can read it. -->
<header class="topbar">
  <div class="topbar-inner">
    <span class="topbar-brand">Interview prep</span>
  </div>
</header>

<main class="prep">
  <div class="page-head">
    <h1 id="head">Checking your sign-in…</h1>
    <p class="page-sub" id="sub">One moment.</p>
  </div>

  <!-- Without this, a candidate with JavaScript switched off waits on "Checking your sign-in…"
       for as long as they are willing to, because the only thing that ever moves them off this
       page is the script below. Markup with no flow of its own: it names the one door out. -->
  <noscript>
    <p>This page needs JavaScript to check whether you are signed in.
      <a href="/prep/login">Go to the sign-in page</a>.</p>
  </noscript>
</main>

<script>
(function () {
  "use strict";

  // The session lives in an HttpOnly cookie, so the only way to ask "am I signed in?" is to
  // ask the server. It answers 200 either way — see functions/prep/auth/session.js for why a
  // 401 on the ordinary signed-out path would be the wrong answer.
  fetch("/prep/auth/session", { headers: { accept: "application/json" } })
    .then(function (response) { return response.json(); })
    .then(function (body) {
      if (!body.ok) {
        window.location.replace("/prep/login");
        return;
      }
      // `replace`, not `assign`, on both branches: this page is a junction and never a
      // destination, so leaving it in the history only gives Back somewhere useless to land.
      window.location.replace("/prep/brief");
    })
    .catch(function () {
      // A failed check is not a session. Fail closed, and let the login page explain itself.
      window.location.replace("/prep/login");
    });
})();
</script>
</body>
</html>
