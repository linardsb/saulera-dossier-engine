# Pages Functions for the client knowledge store (#5) and, since #6, the one generation
# endpoint. `POST /api/generate` is the single model-call boundary — architecture §5.6 — and it
# is the reason ANTHROPIC_API_KEY and a runtime SDK now exist on this deployment. See "Model
# access" and "Pages Functions" under Decisions in README.md for what that amendment does and
# does not relax.
#
# The D1 binding is deliberately not here. `DB` is bound per deployment through the Pages API by
# scripts/setup-d1.py, because a database_id is per-agency *config* and this file is *engine* —
# tracked upstream and pulled by every agency. An id here forks an engine file per agency and
# conflicts on every pull. There is a one-way door in it too: once a field lives in this file
# Cloudflare stops allowing that field to be edited in the dashboard, which is what would make
# the choice expensive to reverse.
#
# `name` must match the Pages project exactly or the build fails.

name = "saulera-dossier-engine"
pages_build_output_dir = "./public"

compatibility_date = "2026-07-27"

# Required by @anthropic-ai/sdk (#6), which imports Node built-ins. Without it the bundle still
# builds and the Function still loads — wrangler only warns — and then the FIRST REAL MODEL CALL
# throws at runtime. That failure mode is why this is a flag and not a comment.
compatibility_flags = ["nodejs_compat"]
